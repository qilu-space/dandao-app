<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>三径 · 流水寂境</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="丹道少年">
    <link rel="manifest" href="manifest.json">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0d0b0a;
            font-family: 'STSong', '华文宋体', 'SimSun', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.9);
            background-image: radial-gradient(ellipse at 50% 55%, rgba(30, 25, 22, 0.3) 0%, #0d0b0a 90%);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100vw;
            height: 100vw;
            max-height: 100vh;
            max-width: 100vh;
            padding: 2vh 4vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            aspect-ratio: 1 / 1;
            transition: all 0.4s ease;
        }

        .container.floating {
            width: 120px;
            height: 120px;
            max-width: 120px;
            max-height: 120px;
            border-radius: 50%;
            background: rgba(13, 11, 10, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            padding: 0;
            position: fixed;
            bottom: 40px;
            right: 20px;
            z-index: 99999;
            cursor: move;
            touch-action: none;
            aspect-ratio: 1 / 1;
            backdrop-filter: blur(8px);
        }

        .container.floating .timer {
            font-size: 28px !important;
            color: rgba(255, 255, 255, 0.6) !important;
        }

        .container.floating .top-bar,
        .container.floating .stone-dial,
        .container.floating .middle-info,
        .container.floating .complete-message,
        .container.floating .install-btn,
        .container.floating .float-toggle,
        .container.floating .ripple-container {
            display: none !important;
        }

        .container.floating .timer-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .container.floating .timer {
            font-size: 28px !important;
            color: rgba(255, 255, 255, 0.6) !important;
            letter-spacing: 0.05em;
        }

        .container.floating .timer.running {
            color: rgba(255, 255, 255, 0.7) !important;
        }

        .container.floating .floating-controls {
            display: flex !important;
            position: absolute;
            bottom: -32px;
            left: 50%;
            transform: translateX(-50%);
            gap: 12px;
            pointer-events: auto;
        }

        .floating-controls {
            display: none;
        }

        .floating-controls button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.15);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.1em;
        }

        .floating-controls button:hover {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.25);
        }

        .install-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px 16px;
            background: rgba(13, 11, 10, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            z-index: 9998;
            display: none;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .install-banner.show {
            display: flex;
        }

        .install-banner .info .icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: #0d0b0a;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .install-banner .info .text {
            font-size: 13px;
            font-weight: 200;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.25);
            line-height: 1.3;
        }

        .install-banner .info .text span {
            color: rgba(255, 255, 255, 0.08);
            font-size: 10px;
            display: block;
        }

        .install-banner .actions button {
            padding: 6px 16px;
            border: none;
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 0;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .install-banner .actions button:hover {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.25);
        }

        .install-guide {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 11, 10, 0.92);
            backdrop-filter: blur(20px);
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4vh 6vw;
        }

        .install-guide.show {
            display: flex;
        }

        .install-guide .close-btn {
            position: absolute;
            top: 3vh;
            right: 4vw;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.10);
            cursor: pointer;
            font-family: inherit;
            background: none;
            border: none;
            transition: color 0.3s ease;
        }

        .install-guide .close-btn:hover {
            color: rgba(255, 255, 255, 0.15);
        }

        .install-guide .title {
            font-size: clamp(18px, 2.5vw, 32px);
            font-weight: 200;
            letter-spacing: 0.3em;
            color: rgba(255, 255, 255, 0.25);
            margin-bottom: 1vh;
        }

        .install-guide .subtitle {
            font-size: clamp(11px, 1vw, 15px);
            font-weight: 200;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.08);
            margin-bottom: 3vh;
            text-align: center;
        }

        .install-guide .steps {
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.5vh;
        }

        .install-guide .step {
            display: flex;
            align-items: center;
            gap: 2vw;
            padding: 1.2vh 1.5vw;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .install-guide .step:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .install-guide .step .icon {
            font-size: clamp(18px, 2.5vw, 30px);
            flex-shrink: 0;
            opacity: 0.2;
            width: 36px;
            text-align: center;
        }

        .install-guide .step .text {
            font-size: clamp(12px, 1.1vw, 15px);
            font-weight: 200;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.2);
            line-height: 1.5;
            flex: 1;
        }

        .install-guide .step .text .highlight {
            color: rgba(255, 255, 255, 0.06);
            font-size: 0.85em;
            display: block;
            margin-top: 2px;
        }

        .install-guide .copy-area {
            margin-top: 3vh;
            display: flex;
            align-items: center;
            gap: 2vw;
            width: 100%;
            max-width: 400px;
        }

        .install-guide .copy-area input {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 0.8vh 1.5vw;
            color: rgba(255, 255, 255, 0.2);
            font-size: clamp(10px, 0.8vw, 12px);
            font-family: inherit;
            letter-spacing: 0.05em;
            border-radius: 0;
            outline: none;
        }

        .install-guide .copy-area button {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 0.8vh 2vw;
            color: rgba(255, 255, 255, 0.12);
            font-family: inherit;
            font-size: clamp(10px, 0.8vw, 12px);
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.2em;
            border-radius: 0;
            white-space: nowrap;
        }

        .install-guide .copy-area button:hover {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.2);
        }

        .install-guide .copy-area button.copied {
            color: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.06);
        }

        .install-guide .footer-hint {
            margin-top: 2.5vh;
            font-size: clamp(9px, 0.6vw, 11px);
            color: rgba(255, 255, 255, 0.04);
            letter-spacing: 0.2em;
            text-align: center;
        }

        .top-bar {
            position: absolute;
            top: 2vh;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            gap: 0.8vh;
        }

        .logo-seal {
            display: flex;
            align-items: center;
            gap: 0.6vw;
            border: none;
            padding: 0.2vh 0;
            letter-spacing: 0.15em;
            font-size: clamp(28px, 4.5vw, 52px);
            font-weight: 200;
            color: rgba(255, 255, 255, 0.85);
            user-select: none;
            white-space: nowrap;
            background: transparent;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.02);
        }

        .logo-seal .sanjing-en {
            font-size: 0.4em;
            letter-spacing: 0.3em;
            color: rgba(255, 255, 255, 0.35);
            font-weight: 200;
        }

        .top-stats {
            display: flex;
            align-items: center;
            gap: clamp(12px, 2.5vw, 28px);
            margin-top: 0.2vh;
        }

        .top-stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.1vh;
        }

        .top-stat-label {
            font-size: clamp(6px, 0.6vw, 9px);
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.15);
        }

        .top-stat-value {
            font-size: clamp(13px, 1.6vw, 20px);
            font-weight: 200;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.60);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.02);
        }

        .timer-wrapper {
            position: absolute;
            top: 46%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3;
            width: 100%;
            pointer-events: none;
        }

        .timer {
            font-size: clamp(80px, 22vw, 200px);
            font-weight: 200;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.70);
            font-variant-numeric: tabular-nums;
            transition: all 0.6s ease;
            user-select: none;
            line-height: 1;
            pointer-events: auto;
            position: relative;
            z-index: 2;
            text-shadow: 0 0 50px rgba(255, 255, 255, 0.04);
        }

        .timer.running {
            color: rgba(255, 255, 255, 0.80);
        }

        .timer.complete {
            color: rgba(255, 255, 255, 0.95);
            letter-spacing: 0.1em;
        }

        .stone-dial {
            position: relative;
            display: flex;
            align-items: center;
            gap: 1.2vw;
            margin-top: 1.5vh;
            pointer-events: auto;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            z-index: 2;
            padding: 0.4vh 1.5vw 0.4vh 1vw;
            border: none;
            background: transparent;
            transition: all 0.3s ease;
            border-radius: 0;
            min-width: 80px;
            justify-content: center;
        }

        .stone-dial:active {
            transform: scale(0.96);
        }

        .stone-dial input {
            display: none;
        }

        .stone-lever {
            display: block;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .stone-lever::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 5px;
            width: 8px;
            height: 3px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            transform: rotate(-15deg);
        }

        .stone-lever::after {
            content: '';
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 5px;
            height: 2px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.02);
            transform: rotate(10deg);
        }

        .stone-dial.active .stone-lever {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 2px 12px rgba(255, 255, 255, 0.02);
            transform: translateX(2px);
        }

        .stone-dial.active .dial-label {
            color: rgba(255, 255, 255, 0.50);
        }

        .stone-dial.complete .stone-lever {
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.02);
            box-shadow: none;
            transform: none;
        }

        .stone-dial.complete .dial-label {
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 0.5em;
        }

        .dial-label {
            font-size: clamp(20px, 2.6vw, 32px);
            font-weight: 200;
            letter-spacing: 0.3em;
            color: rgba(255, 255, 255, 0.25);
            transition: all 0.3s ease;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.02);
        }

        /* ===== 水波荡漾（位置下移） ===== */
        .ripple-container {
            position: absolute;
            top: 66%;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            z-index: 2;
            pointer-events: none;
        }

        .ripple-drop {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.80);
            transform: translate(-50%, -50%);
            animation: dropFall 1.2s ease-in forwards;
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.15);
        }

        .ripple-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            box-shadow: 0 0 24px rgba(255, 255, 255, 0.04);
        }

        .ripple-ring.active {
            animation: rippleExpand 2.5s ease-out forwards;
        }

        @keyframes dropFall {
            0% {
                transform: translate(-50%, -50%) translateY(-15px) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) translateY(0) scale(0.3);
                opacity: 0;
            }
        }

        @keyframes rippleExpand {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0.8;
                border-color: rgba(255, 255, 255, 0.25);
            }
            60% {
                opacity: 0.5;
                border-color: rgba(255, 255, 255, 0.12);
            }
            100% {
                transform: translate(-50%, -50%) scale(3);
                opacity: 0;
                border-color: rgba(255, 255, 255, 0);
            }
        }

        .bottom-date {
            position: absolute;
            bottom: 3vh;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 2.5vw;
            z-index: 4;
            pointer-events: none;
            white-space: nowrap;
        }

        .bottom-date .date {
            font-size: clamp(14px, 2.8vw, 32px);
            font-weight: 200;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.15);
            user-select: none;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.01);
        }

        .bottom-date .days {
            font-size: clamp(14px, 2.8vw, 32px);
            font-weight: 200;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.15);
            user-select: none;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.01);
        }

        .bottom-date .days .num {
            color: rgba(255, 255, 255, 0.30);
            font-weight: 300;
        }

        .incense-area {
            position: absolute;
            bottom: 6vh;
            left: 4vw;
            width: 10vw;
            max-width: 56px;
            aspect-ratio: 1 / 1.4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            z-index: 2;
            opacity: 0.12;
        }

        .ash-tray {
            width: 20%;
            height: 2px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 1px;
            margin-bottom: 0.3vh;
        }

        .stick-wrap {
            position: relative;
            width: 100%;
            height: 65%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .stick-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .stick-path {
            fill: none;
            stroke: rgba(255, 255, 255, 0.04);
            stroke-width: 2.5;
            stroke-linecap: round;
        }

        .stick-burn {
            fill: none;
            stroke: rgba(255, 255, 255, 0.015);
            stroke-width: 2.5;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.8s ease;
        }

        .tip-glow {
            position: absolute;
            bottom: 32%;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.01);
            transition: all 0.6s ease;
            pointer-events: none;
        }

        .complete-message {
            position: absolute;
            bottom: 11vh;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(8px, 1vw, 12px);
            letter-spacing: 0.6em;
            color: rgba(255, 255, 255, 0.01);
            transition: all 1.5s ease;
            user-select: none;
            z-index: 4;
            pointer-events: none;
        }

        .complete-message.show {
            color: rgba(255, 255, 255, 0.10);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.02);
        }

        .float-toggle {
            position: absolute;
            top: 1.5vh;
            right: 2vw;
            font-size: clamp(10px, 0.8vw, 14px);
            font-weight: 200;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.08);
            background: none;
            border: none;
            font-family: inherit;
            cursor: pointer;
            z-index: 20;
            transition: color 0.3s ease;
            padding: 4px 8px;
        }

        .float-toggle:hover {
            color: rgba(255, 255, 255, 0.12);
        }

        .install-btn {
            position: absolute;
            top: 1.5vh;
            left: 2vw;
            font-size: clamp(10px, 0.8vw, 14px);
            font-weight: 200;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.08);
            background: none;
            border: none;
            font-family: inherit;
            cursor: pointer;
            z-index: 20;
            transition: color 0.3s ease;
            padding: 4px 8px;
        }

        .install-btn:hover {
            color: rgba(255, 255, 255, 0.12);
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5vh 4vw;
            }
            .timer {
                font-size: clamp(56px, 18vw, 120px);
            }
            .logo-seal {
                font-size: clamp(22px, 3.8vw, 32px);
            }
            .top-stat-value {
                font-size: clamp(11px, 1.4vw, 16px);
            }
            .top-stats {
                gap: 10px;
            }
            .stone-dial {
                padding: 0.3vh 2.5vw 0.3vh 1.5vw;
                min-width: 60px;
            }
            .stone-lever {
                width: 18px;
                height: 18px;
            }
            .dial-label {
                font-size: clamp(16px, 2.2vw, 24px);
            }
            .ripple-container {
                width: 80px;
                height: 80px;
                top: 64%;
            }
            .bottom-date .date {
                font-size: clamp(12px, 2.5vw, 22px);
            }
            .bottom-date .days {
                font-size: clamp(12px, 2.5vw, 22px);
            }
            .float-toggle {
                font-size: 8px;
                top: 1vh;
                right: 2vw;
            }
            .install-btn {
                font-size: 8px;
                top: 1vh;
                left: 2vw;
            }
            .container.floating {
                width: 80px;
                height: 80px;
                max-width: 80px;
                max-height: 80px;
                bottom: 20px;
                right: 10px;
            }
            .container.floating .timer {
                font-size: 20px !important;
            }
            .floating-controls button {
                font-size: 8px;
                padding: 1px 6px;
            }
            .install-guide .step .text {
                font-size: 11px;
            }
            .install-guide .step .icon {
                font-size: 18px;
                width: 30px;
            }
            .install-banner {
                padding: 10px 12px;
            }
            .install-banner .info .text {
                font-size: 11px;
            }
            .install-banner .actions button {
                font-size: 10px;
                padding: 4px 12px;
            }
            .bottom-date {
                bottom: 2vh;
            }
        }

        @media (max-height: 700px) {
            .timer {
                font-size: clamp(48px, 16vw, 90px);
            }
            .logo-seal {
                font-size: clamp(20px, 3.5vw, 28px);
            }
            .top-stat-value {
                font-size: clamp(11px, 1.4vw, 16px);
            }
            .top-stats {
                gap: 8px;
            }
            .stone-dial {
                padding: 0.2vh 2vw 0.2vh 1vw;
                min-width: 50px;
            }
            .stone-lever {
                width: 16px;
                height: 16px;
            }
            .dial-label {
                font-size: clamp(14px, 2vw, 22px);
            }
            .ripple-container {
                width: 70px;
                height: 70px;
                top: 64%;
            }
            .bottom-date .date {
                font-size: clamp(12px, 2.5vw, 22px);
            }
            .bottom-date .days {
                font-size: clamp(12px, 2.5vw, 22px);
            }
            .top-bar {
                top: 1.2vh;
            }
            .float-toggle {
                font-size: 8px;
                top: 1vh;
                right: 1.5vw;
            }
            .install-btn {
                font-size: 8px;
                top: 1vh;
                left: 1.5vw;
            }
            .container.floating {
                width: 70px;
                height: 70px;
                max-width: 70px;
                max-height: 70px;
            }
            .container.floating .timer {
                font-size: 18px !important;
            }
            .bottom-date {
                bottom: 1.5vh;
            }
        }
    </style>
</head>
<body>

    <div class="install-banner" id="installBanner">
        <div class="info">
            <div class="icon">🧘</div>
            <div class="text">
                安装「丹道少年」全屏体验
                <span>无地址栏 · 像 App 一样打开</span>
            </div>
        </div>
        <div class="actions">
            <button class="btn-install" id="bannerInstallBtn">安装指引</button>
            <button class="btn-close" id="bannerCloseBtn">✕</button>
        </div>
    </div>

    <div class="install-guide" id="installGuide">
        <button class="close-btn" id="installClose">✕</button>
        <div class="title">— 安 装 到 桌 面 —</div>
        <div class="subtitle">全屏打开 · 无地址栏 · 像原生 App</div>
        <div class="steps">
            <div class="step">
                <span class="icon">❶</span>
                <span class="text">用 Chrome 或华为浏览器打开<span class="highlight">其他浏览器可能不支持全屏安装</span></span>
            </div>
            <div class="step">
                <span class="icon">❷</span>
                <span class="text">点击地址栏右侧「安装」图标<span class="highlight">或点击浏览器菜单 → 「添加到主屏幕」</span></span>
            </div>
            <div class="step">
                <span class="icon">❸</span>
                <span class="text">点击「安装」→ 桌面出现「丹道少年」<span class="highlight">打开即全屏，无地址栏</span></span>
            </div>
        </div>
        <div class="copy-area">
            <input type="text" id="copyInput" value="https://sanjing-dandao.netlify.app" readonly>
            <button id="copyBtn">复制链接</button>
        </div>
        <div class="footer-hint">如果以上方法无效，复制链接后通过手机「添加网页快捷方式」功能操作</div>
    </div>

    <div class="container" id="mainContainer">

        <button class="install-btn" id="installBtn">◎ 安装</button>
        <button class="float-toggle" id="floatToggle">◉ 浮窗</button>

        <div class="top-bar">
            <div class="logo-seal">
                三径
                <span class="sanjing-en">sanjing</span>
            </div>
            <div class="top-stats">
                <div class="top-stat-item">
                    <span class="top-stat-label">境界</span>
                    <span class="top-stat-value" id="topRealmDisplay">筑基</span>
                </div>
                <div class="top-stat-item">
                    <span class="top-stat-label">真气</span>
                    <span class="top-stat-value" id="topQiDisplay">0</span>
                </div>
                <div class="top-stat-item">
                    <span class="top-stat-label">站桩</span>
                    <span class="top-stat-value" id="topCountDisplay">0</span>
                </div>
            </div>
        </div>

        <div class="timer-wrapper">
            <div class="timer" id="timerDisplay">00:00</div>
            <label class="stone-dial" id="mainBtn">
                <input type="checkbox" />
                <span class="stone-lever" id="lever"></span>
                <span class="dial-label" id="labelText">开 炼</span>
            </label>
        </div>

        <div class="ripple-container" id="rippleContainer"></div>

        <div class="bottom-date" id="bottomDate">
            <span class="date" id="dateDisplay"></span>
            <span class="days">磨炼 · <span class="num" id="daysDisplay">0</span> 日</span>
        </div>

        <div class="incense-area" id="incenseArea">
            <div class="stick-wrap">
                <svg class="stick-svg" viewBox="0 0 200 260" preserveAspectRatio="xMidYMid meet">
                    <path class="stick-path" d="M 100 240 Q 98 180, 100 120 Q 102 80, 100 60" />
                    <path class="stick-burn" id="stickBurn" d="M 100 240 Q 98 180, 100 120 Q 102 80, 100 60"
                    stroke-dasharray="240" stroke-dashoffset="240" />
                </svg>
            </div>
            <div class="tip-glow" id="tipGlow"></div>
            <div class="ash-tray"></div>
        </div>

        <div class="floating-controls" id="floatingControls">
            <button id="floatExpand">↗ 展开</button>
            <button id="floatReset">⟳ 重置</button>
        </div>

    </div>

    <script>
        console.log('🧘 丹道少年 · 水波荡漾加载');

        const container = document.getElementById('mainContainer');
        const floatToggle = document.getElementById('floatToggle');
        const floatExpand = document.getElementById('floatExpand');
        const floatReset = document.getElementById('floatReset');
        const floatingControls = document.getElementById('floatingControls');

        const installBtn = document.getElementById('installBtn');
        const installGuide = document.getElementById('installGuide');
        const installClose = document.getElementById('installClose');
        const copyBtn = document.getElementById('copyBtn');
        const copyInput = document.getElementById('copyInput');

        const installBanner = document.getElementById('installBanner');
        const bannerInstallBtn = document.getElementById('bannerInstallBtn');
        const bannerCloseBtn = document.getElementById('bannerCloseBtn');

        const timerDisplay = document.getElementById('timerDisplay');
        const mainBtn = document.getElementById('mainBtn');
        const lever = document.getElementById('lever');
        const labelText = document.getElementById('labelText');
        const stickBurn = document.getElementById('stickBurn');
        const tipGlow = document.getElementById('tipGlow');
        const rippleContainer = document.getElementById('rippleContainer');
        const dateDisplay = document.getElementById('dateDisplay');
        const daysDisplay = document.getElementById('daysDisplay');

        const topRealmDisplay = document.getElementById('topRealmDisplay');
        const topQiDisplay = document.getElementById('topQiDisplay');
        const topCountDisplay = document.getElementById('topCountDisplay');

        let rippleTimer = null;
        let rippleRunning = false;

        function createRipple() {
            if (!rippleRunning) return;

            const drop = document.createElement('div');
            drop.className = 'ripple-drop';
            drop.style.animationDuration = (0.8 + Math.random() * 0.4) + 's';
            drop.style.width = (3 + Math.random() * 4) + 'px';
            drop.style.height = (3 + Math.random() * 4) + 'px';
            drop.style.background = 'rgba(255,255,255,' + (0.60 + Math.random() * 0.35) + ')';
            drop.style.boxShadow = '0 0 16px rgba(255,255,255,0.15)';
            rippleContainer.appendChild(drop);

            setTimeout(() => {
                if (drop.parentNode) drop.remove();

                const ringCount = 3 + Math.floor(Math.random() * 2);
                for (let i = 0; i < ringCount; i++) {
                    setTimeout(() => {
                        const ring = document.createElement('div');
                        ring.className = 'ripple-ring';
                        const size = 12 + Math.random() * 24;
                        ring.style.width = size + 'px';
                        ring.style.height = size + 'px';
                        ring.style.borderColor = 'rgba(255,255,255,' + (0.12 + Math.random() * 0.18) + ')';
                        ring.style.borderWidth = (1 + Math.random() * 1.5) + 'px';
                        ring.style.animationDuration = (1.8 + Math.random() * 1.2) + 's';
                        ring.style.animationDelay = (Math.random() * 0.3) + 's';
                        ring.style.boxShadow = '0 0 24px rgba(255,255,255,0.04)';
                        rippleContainer.appendChild(ring);
                        ring.classList.add('active');
                        setTimeout(() => {
                            if (ring.parentNode) ring.remove();
                        }, 3500);
                    }, i * 200 + Math.random() * 150);
                }
            }, 800 + Math.random() * 200);
        }

        function startRipple() {
            if (rippleRunning) return;
            rippleRunning = true;
            setTimeout(() => createRipple(), 300);
            rippleTimer = setInterval(() => {
                if (rippleRunning) createRipple();
            }, 2200 + Math.random() * 1500);
        }

        function stopRipple() {
            rippleRunning = false;
            if (rippleTimer) {
                clearInterval(rippleTimer);
                rippleTimer = null;
            }
            setTimeout(() => {
                rippleContainer.innerHTML = '';
            }, 1000);
        }

        function isInstalled() {
            return window.matchMedia('(display-mode: standalone)').matches ||
                window.navigator.standalone === true;
        }

        let bannerShown = false;

        function showInstallBanner() {
            if (isInstalled()) return;
            if (bannerShown) return;
            setTimeout(() => {
                installBanner.classList.add('show');
                bannerShown = true;
            }, 3000);
        }

        function hideInstallBanner() {
            installBanner.classList.remove('show');
        }

        function showInstallGuide() {
            installGuide.classList.add('show');
            hideInstallBanner();
        }

        function hideInstallGuide() {
            installGuide.classList.remove('show');
        }

        function copyLink() {
            const text = copyInput.value;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    copyBtn.textContent = '✓ 已复制';
                    copyBtn.classList.add('copied');
                    setTimeout(() => {
                        copyBtn.textContent = '复制链接';
                        copyBtn.classList.remove('copied');
                    }, 2000);
                }).catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            copyInput.select();
            copyInput.setSelectionRange(0, 99999);
            try {
                document.execCommand('copy');
                copyBtn.textContent = '✓ 已复制';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.textContent = '复制链接';
                    copyBtn.classList.remove('copied');
                }, 2000);
            } catch (e) {
                alert('请手动复制链接: ' + text);
            }
        }

        let isFloating = false;
        let offsetX = 0,
            offsetY = 0;
        let isDragging = false;
        let dragStartX = 0,
            dragStartY = 0;

        function toggleFloat() {
            isFloating = !isFloating;
            if (isFloating) {
                container.classList.add('floating');
                floatingControls.style.display = 'flex';
                floatToggle.textContent = '◉ 展开';
            } else {
                container.classList.remove('floating');
                floatingControls.style.display = 'none';
                floatToggle.textContent = '◉ 浮窗';
                container.style.left = '';
                container.style.right = '20px';
                container.style.bottom = '40px';
                container.style.top = '';
                container.style.transform = '';
            }
        }

        function initDrag(e) {
            if (!isFloating) return;
            isDragging = true;
            const touch = e.touches ? e.touches[0] : e;
            dragStartX = touch.clientX;
            dragStartY = touch.clientY;
            const rect = container.getBoundingClientRect();
            offsetX = rect.left;
            offsetY = rect.top;
            container.style.transition = 'none';
        }

        function moveDrag(e) {
            if (!isDragging || !isFloating) return;
            e.preventDefault();
            const touch = e.touches ? e.touches[0] : e;
            const dx = touch.clientX - dragStartX;
            const dy = touch.clientY - dragStartY;
            container.style.left = (offsetX + dx) + 'px';
            container.style.top = (offsetY + dy) + 'px';
            container.style.right = 'auto';
            container.style.bottom = 'auto';
        }

        function endDrag(e) {
            if (isDragging) {
                isDragging = false;
                container.style.transition = 'all 0.4s ease';
            }
        }

        function updateDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            dateDisplay.textContent = year + '/' + month + '/' + day;
        }

        let practiceDays = 0;

        function loadDays() {
            try {
                const saved = localStorage.getItem('dandao_practice_days');
                if (saved) practiceDays = parseInt(saved) || 0;
            } catch (e) { practiceDays = 0; }
            daysDisplay.textContent = practiceDays;
        }

        function saveDays() {
            try { localStorage.setItem('dandao_practice_days', String(practiceDays)); } catch (e) {}
            daysDisplay.textContent = practiceDays;
        }

        function addPracticeDay() {
            practiceDays += 1;
            saveDays();
            daysDisplay.style.transition = 'color 0.3s';
            daysDisplay.style.color = 'rgba(255,255,255,0.35)';
            setTimeout(() => {
                daysDisplay.style.color = 'rgba(255,255,255,0.15)';
            }, 400);
        }

        let audioCtx = null;
        let waterSource = null;
        let waterGain = null;
        let waterFilter = null;
        let isWaterRunning = false;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new(window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        function startWaterSound() {
            if (isWaterRunning) return;
            isWaterRunning = true;
            try {
                const ctx = getAudioContext();
                const bufferSize = ctx.sampleRate * 4;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    const t = i / bufferSize;
                    const wave = 0.5 + 0.5 * Math.sin(t * 6.28 * 0.3 + Math.sin(t * 6.28 * 0.7) * 0.5);
                    const env = 0.4 + 0.6 * (1 - Math.abs(t - 0.5) * 2);
                    data[i] = (Math.random() - 0.5) * env * wave * 0.4;
                }
                const source = ctx.createBufferSource();
                source.buffer = buffer;
                source.loop = true;
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 800;
                filter.Q.value = 0.8;
                const gain = ctx.createGain();
                gain.gain.value = 0;
                source.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                source.start();
                waterSource = source;
                waterFilter = filter;
                waterGain = gain;
                gain.gain.setTargetAtTime(0.015, ctx.currentTime, 2.0);
            } catch (e) {
                console.log('水流声启动失败:', e);
                isWaterRunning = false;
            }
        }

        function stopWaterSound() {
            if (!isWaterRunning) return;
            isWaterRunning = false;
            try {
                if (waterGain) {
                    waterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 1.5);
                    setTimeout(() => {
                        if (waterSource) { try { waterSource.stop(); } catch (e) {} waterSource = null; }
                        waterGain = null;
                        waterFilter = null;
                    }, 2000);
                }
            } catch (e) {}
        }

        function playBell() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(130.81, now);
                osc.frequency.exponentialRampToValueAtTime(110.00, now + 2.0);
                gain.gain.setValueAtTime(0.04, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 3.5);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 3.5);
            } catch (e) {}
        }

        function playChime() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880.00, now);
                osc.frequency.exponentialRampToValueAtTime(1100.00, now + 0.15);
                osc.frequency.exponentialRampToValueAtTime(740.00, now + 1.2);
                gain.gain.setValueAtTime(0.025, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 2.5);
            } catch (e) {}
        }

        const TARGET_SECONDS = 40 * 60;
        const TOTAL_LENGTH = 240;

        let seconds = 0;
        let qi = 0;
        let count = 0;
        let timer = null;
        let isRunning = false;
        let realmIndex = 0;
        let isComplete = false;

        const realms = [
            { name: '筑基' },
            { name: '旋照' },
            { name: '融合' },
            { name: '心动' },
            { name: '灵寂' },
            { name: '元婴' }
        ];

        function updateDisplay() {
            const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
            const secs = String(Math.floor(seconds % 60)).padStart(2, '0');
            timerDisplay.textContent = mins + ':' + secs;

            const offset = TOTAL_LENGTH * (1 - Math.min(100, (seconds / TARGET_SECONDS) * 100) / 100);
            stickBurn.setAttribute('stroke-dashoffset', offset);

            topQiDisplay.textContent = Math.floor(qi);
            topCountDisplay.textContent = count;
            topRealmDisplay.textContent = realms[realmIndex].name;

            if (seconds >= TARGET_SECONDS && !isComplete) {
                completePractice();
            }
        }

        function completePractice() {
            if (isComplete) return;
            isComplete = true;
            isRunning = false;
            if (timer) { clearInterval(timer);
                timer = null; }

            stopWaterSound();
            stopRipple();
            playChime();

            timerDisplay.classList.add('complete');
            stickBurn.setAttribute('stroke-dashoffset', '0');
            tipGlow.classList.remove('burning');

            labelText.textContent = '圆 满';
            mainBtn.classList.add('complete');
            lever.classList.remove('active');
            mainBtn.classList.remove('active');

            addPracticeDay();
        }

        function checkRealm() {
            const nextIndex = realmIndex + 1;
            if (nextIndex >= realms.length) return;
            const neededDays = (nextIndex) * 100;
            if (practiceDays >= neededDays && qi >= neededDays * 2) {
                realmIndex = nextIndex;
                qi += 50;
                if (qi > 999) qi = 999;
                timerDisplay.style.transition = 'all 0.2s';
                timerDisplay.style.color = 'rgba(255,255,255,0.9)';
                setTimeout(() => { timerDisplay.style.color = ''; }, 400);
                console.log('⬆️ 境界突破:', realms[realmIndex].name);
            }
        }

        function handleMainClick() {
            const checkbox = mainBtn.querySelector('input');
            const isChecked = checkbox.checked;

            if (isComplete) {
                checkbox.checked = false;
                return;
            }

            if (isChecked) {
                if (!isRunning) startPractice();
                mainBtn.classList.add('active');
                labelText.textContent = '收 功';
            } else {
                if (isRunning) stopPractice();
                mainBtn.classList.remove('active');
                labelText.textContent = '开 炼';
            }
        }

        function handleStoneReset() {
            resetAll();
        }

        function startPractice() {
            if (isRunning || isComplete) return;

            playBell();
            startWaterSound();
            startRipple();

            isRunning = true;
            timer = setInterval(() => {
                seconds += 1;
                qi += 1.5;
                count += 1;
                if (qi > 999) qi = 999;
                checkRealm();
                updateDisplay();
            }, 1000);

            timerDisplay.classList.add('running');
            tipGlow.classList.add('burning');
        }

        function stopPractice() {
            if (!isRunning) return;
            isRunning = false;
            clearInterval(timer);
            timer = null;

            stopWaterSound();
            stopRipple();
            timerDisplay.classList.remove('running');
            tipGlow.classList.remove('burning');
        }

        function resetAll() {
            if (isRunning) {
                isRunning = false;
                clearInterval(timer);
                timer = null;
            }
            if (timer) { clearInterval(timer);
                timer = null; }
            stopWaterSound();
            stopRipple();

            seconds = 0;
            qi = 0;
            count = 0;
            realmIndex = 0;
            isComplete = false;
            isRunning = false;

            timerDisplay.classList.remove('complete', 'running');
            stickBurn.setAttribute('stroke-dashoffset', TOTAL_LENGTH);
            tipGlow.classList.remove('burning');

            const checkbox = mainBtn.querySelector('input');
            checkbox.checked = false;
            mainBtn.classList.remove('active', 'complete');
            labelText.textContent = '开 炼';
            labelText.classList.remove('active', 'complete');

            bannerShown = false;
            hideInstallBanner();
            setTimeout(() => showInstallBanner(), 1500);

            updateDisplay();
        }

        mainBtn.addEventListener('click', handleMainClick);

        floatToggle.addEventListener('click', toggleFloat);
        floatExpand.addEventListener('click', function() {
            if (isFloating) toggleFloat();
        });
        floatReset.addEventListener('click', resetAll);

        installBtn.addEventListener('click', showInstallGuide);
        installClose.addEventListener('click', hideInstallGuide);
        copyBtn.addEventListener('click', copyLink);
        installGuide.addEventListener('click', function(e) {
            if (e.target === this) hideInstallGuide();
        });

        bannerInstallBtn.addEventListener('click', showInstallGuide);
        bannerCloseBtn.addEventListener('click', hideInstallBanner);

        container.addEventListener('mousedown', initDrag);
        container.addEventListener('mousemove', moveDrag);
        container.addEventListener('mouseup', endDrag);
        container.addEventListener('mouseleave', endDrag);
        container.addEventListener('touchstart', initDrag, { passive: true });
        container.addEventListener('touchmove', moveDrag, { passive: false });
        container.addEventListener('touchend', endDrag, { passive: true });

        updateDate();
        loadDays();
        updateDisplay();
        setTimeout(() => showInstallBanner(), 1000);

        console.log('✅ 丹道少年 · 水波荡漾 · 位置下移');
        console.log('📱 已安装状态:', isInstalled() ? '✅ 是（全屏模式）' : '❌ 否');
        console.log('⬆️ 境界每100天升级一次');
    </script>
</body>
</html>
