<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>三径 · 流水寂境</title>

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="丹道少年">

    <!-- 安卓 PWA -->
    <link rel="manifest" href="manifest.json">

    <style>
        /* ================================
               1:1 方形 · 小石头拨杆 · 开炼
               品牌增亮 · 字体清晰锐利
               浮窗模式 + 安装指引
               ================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #030202;
            font-family: 'STSong', '华文宋体', 'SimSun', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.9);
            background-image: radial-gradient(ellipse at 50% 55%, rgba(20, 18, 16, 0.4) 0%, #030202 90%);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100vw;
            height: 100vw;
            max-height: 100vh;
            max-width: 100vh;
            padding: 2vh 4vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            aspect-ratio: 1 / 1;
            transition: all 0.4s ease;
        }

        /* ===== 浮窗模式 ===== */
        .container.floating {
            width: 120px;
            height: 120px;
            max-width: 120px;
            max-height: 120px;
            border-radius: 50%;
            background: rgba(3, 2, 2, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.8);
            padding: 0;
            position: fixed;
            bottom: 40px;
            right: 20px;
            z-index: 99999;
            cursor: move;
            touch-action: none;
            aspect-ratio: 1 / 1;
            backdrop-filter: blur(8px);
        }

        .container.floating .timer {
            font-size: 28px !important;
        }

        .container.floating .top-bar,
        .container.floating .mechanical-btn,
        .container.floating .progress-label,
        .container.floating .drip-stone,
        .container.floating .incense-area,
        .container.floating .stats,
        .container.floating .middle-info,
        .container.floating .complete-message,
        .container.floating .install-btn,
        .container.floating .float-toggle {
            display: none !important;
        }

        .container.floating .timer-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .container.floating .timer {
            font-size: 28px !important;
            color: rgba(255, 255, 255, 0.7) !important;
            letter-spacing: 0.05em;
        }

        .container.floating .timer.running {
            color: rgba(255, 255, 255, 0.8) !important;
        }

        .container.floating .floating-controls {
            display: flex !important;
            position: absolute;
            bottom: -32px;
            left: 50%;
            transform: translateX(-50%);
            gap: 12px;
            pointer-events: auto;
        }

        .floating-controls {
            display: none;
        }

        .floating-controls button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.15);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.1em;
        }

        .floating-controls button:hover {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.25);
        }

        /* ===== 安装提示横幅 ===== */
        .install-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px 16px;
            background: rgba(10, 8, 6, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            z-index: 9998;
            display: none;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .install-banner.show {
            display: flex;
        }

        .install-banner .info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .install-banner .info .icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: #030202;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .install-banner .info .text {
            font-size: 13px;
            font-weight: 200;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.3);
            line-height: 1.3;
        }

        .install-banner .info .text span {
            color: rgba(255, 255, 255, 0.08);
            font-size: 10px;
            display: block;
        }

        .install-banner .actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .install-banner .actions button {
            padding: 6px 16px;
            border: none;
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 0;
        }

        .install-banner .actions .btn-install {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .install-banner .actions .btn-install:hover {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.3);
        }

        .install-banner .actions .btn-close {
            background: transparent;
            color: rgba(255, 255, 255, 0.04);
            font-size: 14px;
        }

        .install-banner .actions .btn-close:hover {
            color: rgba(255, 255, 255, 0.08);
        }

        /* ===== 安装指引弹窗 ===== */
        .install-guide {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 2, 2, 0.92);
            backdrop-filter: blur(20px);
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4vh 6vw;
        }

        .install-guide.show {
            display: flex;
        }

        .install-guide .close-btn {
            position: absolute;
            top: 3vh;
            right: 4vw;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            font-family: inherit;
            background: none;
            border: none;
            transition: color 0.3s ease;
        }

        .install-guide .close-btn:hover {
            color: rgba(255, 255, 255, 0.2);
        }

        .install-guide .title {
            font-size: clamp(18px, 2.5vw, 32px);
            font-weight: 200;
            letter-spacing: 0.3em;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 1vh;
        }

        .install-guide .subtitle {
            font-size: clamp(11px, 1vw, 15px);
            font-weight: 200;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.08);
            margin-bottom: 3vh;
            text-align: center;
        }

        .install-guide .steps {
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.5vh;
        }

        .install-guide .step {
            display: flex;
            align-items: center;
            gap: 2vw;
            padding: 1.2vh 1.5vw;
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .install-guide .step:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .install-guide .step .icon {
            font-size: clamp(18px, 2.5vw, 30px);
            flex-shrink: 0;
            opacity: 0.3;
            width: 36px;
            text-align: center;
        }

        .install-guide .step .text {
            font-size: clamp(12px, 1.1vw, 15px);
            font-weight: 200;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.2);
            line-height: 1.5;
            flex: 1;
        }

        .install-guide .step .text .highlight {
            color: rgba(255, 255, 255, 0.05);
            font-size: 0.85em;
            display: block;
            margin-top: 2px;
        }

        .install-guide .copy-area {
            margin-top: 3vh;
            display: flex;
            align-items: center;
            gap: 2vw;
            width: 100%;
            max-width: 400px;
        }

        .install-guide .copy-area input {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 0.8vh 1.5vw;
            color: rgba(255, 255, 255, 0.2);
            font-size: clamp(10px, 0.8vw, 12px);
            font-family: inherit;
            letter-spacing: 0.05em;
            border-radius: 0;
            outline: none;
        }

        .install-guide .copy-area button {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 0.8vh 2vw;
            color: rgba(255, 255, 255, 0.1);
            font-family: inherit;
            font-size: clamp(10px, 0.8vw, 12px);
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.2em;
            border-radius: 0;
            white-space: nowrap;
        }

        .install-guide .copy-area button:hover {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.15);
        }

        .install-guide .copy-area button.copied {
            color: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.06);
        }

        .install-guide .footer-hint {
            margin-top: 2.5vh;
            font-size: clamp(9px, 0.6vw, 11px);
            color: rgba(255, 255, 255, 0.03);
            letter-spacing: 0.2em;
            text-align: center;
        }

        /* ===== 顶部 ===== */
        .top-bar {
            position: absolute;
            top: 2vh;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            gap: 0.3vh;
        }

        .logo-seal {
            display: flex;
            align-items: center;
            gap: 0.6vw;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.4vh 2vw 0.4vh 2vw;
            letter-spacing: 0.15em;
            font-size: clamp(20px, 3.2vw, 38px);
            font-weight: 200;
            color: rgba(255, 255, 255, 0.60);
            user-select: none;
            white-space: nowrap;
            transform: rotate(-0.5deg);
            background: rgba(255, 255, 255, 0.01);
        }

        .logo-seal .sanjing-en {
            font-size: 0.45em;
            letter-spacing: 0.3em;
            color: rgba(255, 255, 255, 0.20);
            font-weight: 200;
        }

        .realm-badge {
            font-size: clamp(8px, 1.1vw, 13px);
            letter-spacing: 0.5em;
            color: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 0.15vh 2vw;
            transition: all 0.8s ease;
            user-select: none;
        }

        .realm-badge.active {
            color: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.06);
        }

        .realm-badge.complete {
            color: rgba(255, 255, 255, 0.08);
        }

        /* ===== 计时器区 ===== */
        .timer-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3;
            width: 100%;
            pointer-events: none;
        }

        .timer {
            font-size: clamp(80px, 22vw, 200px);
            font-weight: 200;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.6);
            font-variant-numeric: tabular-nums;
            transition: all 0.6s ease;
            user-select: none;
            line-height: 1;
            pointer-events: auto;
            position: relative;
            z-index: 2;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.04);
        }

        .timer.running {
            color: rgba(255, 255, 255, 0.7);
        }

        .timer.complete {
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.1em;
        }

        /* ===== 小石头拨杆 ===== */
        .stone-dial {
            position: relative;
            display: flex;
            align-items: center;
            gap: 1.2vw;
            margin-top: 1.5vh;
            pointer-events: auto;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            z-index: 2;
            padding: 0.4vh 1.5vw 0.4vh 1vw;
            border: none;
            background: transparent;
            transition: all 0.3s ease;
            border-radius: 0;
            min-width: 80px;
            justify-content: center;
        }

        .stone-dial:active {
            transform: scale(0.96);
        }

        .stone-dial input {
            display: none;
        }

        .stone-lever {
            display: block;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(80, 85, 90, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }

        .stone-lever::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 5px;
            width: 8px;
            height: 3px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.02);
            transform: rotate(-15deg);
        }

        .stone-lever::after {
            content: '';
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 5px;
            height: 2px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.015);
            transform: rotate(10deg);
        }

        .stone-dial.active .stone-lever {
            background: rgba(120, 130, 140, 0.20);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 2px 12px rgba(255, 255, 255, 0.02), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transform: translateX(2px);
        }

        .stone-dial.active .dial-label {
            color: rgba(255, 255, 255, 0.25);
        }

        .stone-dial.complete .stone-lever {
            background: rgba(80, 85, 90, 0.05);
            border-color: rgba(255, 255, 255, 0.02);
            box-shadow: none;
            transform: none;
        }

        .stone-dial.complete .dial-label {
            color: rgba(255, 255, 255, 0.06);
            letter-spacing: 0.5em;
        }

        .dial-label {
            font-size: clamp(14px, 1.8vw, 22px);
            font-weight: 200;
            letter-spacing: 0.3em;
            color: rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.02);
        }

        .progress-label {
            position: absolute;
            bottom: -5vh;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(8px, 1vw, 12px);
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.10);
            user-select: none;
            pointer-events: none;
            white-space: nowrap;
            z-index: 2;
        }

        /* ===== 日期 + 磨炼 ===== */
        .middle-info {
            position: absolute;
            bottom: 13vh;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 2.5vw;
            z-index: 4;
            pointer-events: none;
            white-space: nowrap;
        }

        .middle-info .date {
            font-size: clamp(18px, 4vw, 44px);
            font-weight: 200;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.20);
            user-select: none;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.02);
        }

        .middle-info .days {
            font-size: clamp(18px, 4vw, 44px);
            font-weight: 200;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.20);
            user-select: none;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.02);
        }

        .middle-info .days .num {
            color: rgba(255, 255, 255, 0.50);
            font-weight: 300;
        }

        /* ===== 滴水石 ===== */
        .drip-stone {
            position: absolute;
            bottom: 7vh;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            width: 60px;
            height: 38px;
            pointer-events: none;
            z-index: 2;
        }

        .stone {
            width: 46px;
            height: 11px;
            background: rgba(80, 85, 90, 0.15);
            border-radius: 40% 40% 50% 50% / 30% 30% 60% 60%;
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            box-shadow: 0 2px 20px rgba(255, 255, 255, 0.02);
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .stone:hover {
            background: rgba(80, 85, 90, 0.25);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .stone:active {
            transform: scale(0.94);
        }

        .stone-wear {
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 0%;
            height: 3px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            transition: width 0.3s ease;
        }

        .stone.reset-glow {
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .water-drop {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 5px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 0 0 50% 50% / 0 0 100% 100%;
            opacity: 0;
            transition: opacity 0.1s ease;
        }

        .water-drop.falling {
            animation: dropFall 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes dropFall {
            0% {
                transform: translateX(-50%) translateY(0) scaleY(1);
                opacity: 0.8;
            }
            60% {
                opacity: 0.9;
            }
            100% {
                transform: translateX(-50%) translateY(18px) scaleY(0.6);
                opacity: 0;
            }
        }

        .splash {
            position: absolute;
            width: 1.5px;
            height: 1.5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }

        .splash.active {
            animation: splashOut 0.6s ease-out forwards;
        }

        @keyframes splashOut {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.4;
            }
            100% {
                transform: translate(var(--sx), var(--sy)) scale(0.2);
                opacity: 0;
            }
        }

        /* ===== 香炉 ===== */
        .incense-area {
            position: absolute;
            bottom: 6vh;
            left: 4vw;
            width: 10vw;
            max-width: 56px;
            aspect-ratio: 1 / 1.4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            z-index: 2;
            opacity: 0.25;
        }

        .ash-tray {
            width: 20%;
            height: 2px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 1px;
            margin-bottom: 0.3vh;
        }

        .stick-wrap {
            position: relative;
            width: 100%;
            height: 65%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .stick-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .stick-path {
            fill: none;
            stroke: rgba(255, 255, 255, 0.06);
            stroke-width: 2.5;
            stroke-linecap: round;
        }

        .stick-burn {
            fill: none;
            stroke: rgba(255, 255, 255, 0.02);
            stroke-width: 2.5;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.8s ease;
        }

        .tip-glow {
            position: absolute;
            bottom: 32%;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.01);
            transition: all 0.6s ease;
            pointer-events: none;
        }

        /* ===== 状态 ===== */
        .stats {
            position: absolute;
            bottom: 4.5vh;
            right: 4vw;
            display: flex;
            gap: clamp(10px, 2.5vw, 22px);
            z-index: 5;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.1vh;
        }

        .stat-label {
            font-size: clamp(6px, 0.7vw, 8px);
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.20);
        }

        .stat-value {
            font-size: clamp(12px, 1.8vw, 18px);
            font-weight: 200;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.6);
        }

        /* ===== 圆满 ===== */
        .complete-message {
            position: absolute;
            bottom: 11vh;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(8px, 1vw, 12px);
            letter-spacing: 0.6em;
            color: rgba(255, 255, 255, 0.02);
            transition: all 1.5s ease;
            user-select: none;
            z-index: 4;
            pointer-events: none;
        }

        .complete-message.show {
            color: rgba(255, 255, 255, 0.12);
        }

        /* ===== 顶部按钮 ===== */

<body>

                    <path class="stick-burn" id="stickBurn" d="M 100 240 Q 98 180, 100 120 Q 102 80, 100 60"
                    stroke-dasharray="240" stroke-dashoffset="240" />

    </div>

    <script>
        // ============================================
        // 丹道少年 · 小石头拨杆 · 完整版
        // ============================================

        console.log('🧘 丹道少年 · 小石头拨杆 · 完整版加载');

        // ============================================
        // DOM 引用
        // ============================================
        const container = document.getElementById('mainContainer');
        const floatToggle = document.getElementById('floatToggle');
        const floatExpand = document.getElementById('floatExpand');
        const floatReset = document.getElementById('floatReset');
        const floatingControls = document.getElementById('floatingControls');

        const installBtn = document.getElementById('installBtn');
        const installGuide = document.getElementById('installGuide');
        const installClose = document.getElementById('installClose');
        const copyBtn = document.getElementById('copyBtn');
        const copyInput = document.getElementById('copyInput');

        const installBanner = document.getElementById('installBanner');
        const bannerInstallBtn = document.getElementById('bannerInstallBtn');
        const bannerCloseBtn = document.getElementById('bannerCloseBtn');

        const timerDisplay = document.getElementById('timerDisplay');
        const mainBtn = document.getElementById('mainBtn');
        const lever = document.getElementById('lever');
        const labelText = document.getElementById('labelText');
        const progressPercent = document.getElementById('progressPercent');
        const stickBurn = document.getElementById('stickBurn');
        const tipGlow = document.getElementById('tipGlow');
        const qiDisplay = document.getElementById('qiDisplay');
        const countDisplay = document.getElementById('countDisplay');
        const realmDisplay = document.getElementById('realmDisplay');
        const realmBadge = document.getElementById('realmBadge');
        const waterDrop = document.getElementById('waterDrop');
        const stoneWear = document.getElementById('stoneWear');
        const stoneBtn = document.getElementById('stoneBtn');
        const splashContainer = document.getElementById('splashContainer');
        const dateDisplay = document.getElementById('dateDisplay');
        const daysDisplay = document.getElementById('daysDisplay');

        // ============================================
        // 检测是否已安装（全屏模式）
        // ============================================
        function isInstalled() {
            return window.matchMedia('(display-mode: standalone)').matches ||
                window.navigator.standalone === true;
        }

        // ============================================
        // 安装横幅逻辑
        // ============================================
        let bannerShown = false;

        function showInstallBanner() {
            if (isInstalled()) {
                console.log('✅ 已安装，不显示横幅');
                return;
            }
            if (bannerShown) return;
            setTimeout(() => {
                installBanner.classList.add('show');
                bannerShown = true;
            }, 3000);
        }

        function hideInstallBanner() {
            installBanner.classList.remove('show');
        }

        // ============================================
        // 安装指引弹窗
        // ============================================
        function showInstallGuide() {
            installGuide.classList.add('show');
            hideInstallBanner();
        }

        function hideInstallGuide() {
            installGuide.classList.remove('show');
        }

        function copyLink() {
            const text = copyInput.value;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    copyBtn.textContent = '✓ 已复制';
                    copyBtn.classList.add('copied');
                    setTimeout(() => {
                        copyBtn.textContent = '复制链接';
                        copyBtn.classList.remove('copied');
                    }, 2000);
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            copyInput.select();
            copyInput.setSelectionRange(0, 99999);
            try {
                document.execCommand('copy');
                copyBtn.textContent = '✓ 已复制';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.textContent = '复制链接';
                    copyBtn.classList.remove('copied');
                }, 2000);
            } catch (e) {
                alert('请手动复制链接: ' + text);
            }
        }

        // ============================================
        // 浮窗模式
        // ============================================
        let isFloating = false;
        let offsetX = 0,
            offsetY = 0;
        let isDragging = false;
        let dragStartX = 0,
            dragStartY = 0;

        function toggleFloat() {
            isFloating = !isFloating;
            if (isFloating) {
                container.classList.add('floating');
                floatingControls.style.display = 'flex';
                floatToggle.textContent = '◉ 展开';
            } else {
                container.classList.remove('floating');
                floatingControls.style.display = 'none';
                floatToggle.textContent = '◉ 浮窗';
                container.style.left = '';
                container.style.right = '20px';
                container.style.bottom = '40px';
                container.style.top = '';
                container.style.transform = '';
            }
        }

        function initDrag(e) {
            if (!isFloating) return;
            isDragging = true;
            const touch = e.touches ? e.touches[0] : e;
            dragStartX = touch.clientX;
            dragStartY = touch.clientY;
            const rect = container.getBoundingClientRect();
            offsetX = rect.left;
            offsetY = rect.top;
            container.style.transition = 'none';
        }

        function moveDrag(e) {
            if (!isDragging || !isFloating) return;
            e.preventDefault();
            const touch = e.touches ? e.touches[0] : e;
            const dx = touch.clientX - dragStartX;
            const dy = touch.clientY - dragStartY;
            container.style.left = (offsetX + dx) + 'px';
            container.style.top = (offsetY + dy) + 'px';
            container.style.right = 'auto';
            container.style.bottom = 'auto';
        }

        function endDrag(e) {
            if (isDragging) {
                isDragging = false;
                container.style.transition = 'all 0.4s ease';
            }
        }

        // ============================================
        // 日期
        // ============================================
        function updateDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            dateDisplay.textContent = year + '/' + month + '/' + day;
        }

        // ============================================
        // 天数持久化
        // ============================================
        let practiceDays = 0;

        function loadDays() {
            try {
                const saved = localStorage.getItem('dandao_practice_days');
                if (saved) practiceDays = parseInt(saved) || 0;
            } catch (e) { practiceDays = 0; }
            daysDisplay.textContent = practiceDays;
        }

        function saveDays() {
            try { localStorage.setItem('dandao_practice_days', String(practiceDays)); } catch (e) {}
            daysDisplay.textContent = practiceDays;
        }

        function addPracticeDay() {
            practiceDays += 1;
            saveDays();
            daysDisplay.style.transition = 'color 0.3s';
            daysDisplay.style.color = 'rgba(255,255,255,0.4)';
            setTimeout(() => {
                daysDisplay.style.color = 'rgba(255,255,255,0.15)';
            }, 400);
        }

        // ============================================
        // 音频
        // ============================================
        let audioCtx = null;
        let waterSource = null;
        let waterGain = null;
        let waterFilter = null;
        let isWaterRunning = false;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new(window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        function startWaterSound() {
            if (isWaterRunning) return;
            isWaterRunning = true;
            try {
                const ctx = getAudioContext();
                const bufferSize = ctx.sampleRate * 4;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    const t = i / bufferSize;
                    const wave = 0.5 + 0.5 * Math.sin(t * 6.28 * 0.3 + Math.sin(t * 6.28 * 0.7) * 0.5);
                    const env = 0.4 + 0.6 * (1 - Math.abs(t - 0.5) * 2);
                    data[i] = (Math.random() - 0.5) * env * wave * 0.4;
                }
                const source = ctx.createBufferSource();
                source.buffer = buffer;
                source.loop = true;
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 800;
                filter.Q.value = 0.8;
                const gain = ctx.createGain();
                gain.gain.value = 0;
                source.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                source.start();
                waterSource = source;
                waterFilter = filter;
                waterGain = gain;
                gain.gain.setTargetAtTime(0.028, ctx.currentTime, 2.0);
            } catch (e) {
                console.log('水流声启动失败:', e);
                isWaterRunning = false;
            }
        }

        function stopWaterSound() {
            if (!isWaterRunning) return;
            isWaterRunning = false;
            try {
                if (waterGain) {
                    waterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 1.5);
                    setTimeout(() => {
                        if (waterSource) { try { waterSource.stop(); } catch (e) {} waterSource = null; }
                        waterGain = null;
                        waterFilter = null;
                    }, 2000);
                }
            } catch (e) {}
        }

        function playBell() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(130.81, now);
                osc.frequency.exponentialRampToValueAtTime(110.00, now + 2.0);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 3.5);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 3.5);
            } catch (e) {}
        }

        function playChime() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880.00, now);
                osc.frequency.exponentialRampToValueAtTime(1100.00, now + 0.15);
                osc.frequency.exponentialRampToValueAtTime(740.00, now + 1.2);
                gain.gain.setValueAtTime(0.035, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 2.5);
            } catch (e) {}
        }

        // ============================================
        // 水滴
        // ============================================
        function triggerDrop() {
            waterDrop.classList.remove('falling');
            void waterDrop.offsetWidth;
            waterDrop.classList.add('falling');
            createSplash();
            const progress = Math.min(100, (seconds / TARGET_SECONDS) * 100);
            stoneWear.style.width = progress + '%';
        }

        function createSplash() {
            const count = 4;
            for (let i = 0; i < count; i++) {
                const splash = document.createElement('div');
                splash.className = 'splash';
                const angle = (Math.random() - 0.5) * Math.PI * 0.6;
                const dist = 4 + Math.random() * 10;
                const x = Math.sin(angle) * dist;
                const y = -Math.cos(angle) * dist * 1.2 - 4;
                splash.style.setProperty('--sx', x + 'px');
                splash.style.setProperty('--sy', y + 'px');
                splash.style.left = '50%';
                splash.style.top = 'calc(100% - 4px)';
                splash.style.transform = 'translateX(-50%)';
                splashContainer.appendChild(splash);
                requestAnimationFrame(() => { splash.classList.add('active'); });
                setTimeout(() => { splash.remove(); }, 600);
            }
        }

        // ============================================
        // 状态
        // ============================================
        const TARGET_SECONDS = 40 * 60;
        const TOTAL_LENGTH = 240;

        let seconds = 0;
        let qi = 0;
        let count = 0;
        let timer = null;
        let isRunning = false;
        let realmIndex = 0;
        let isComplete = false;

        const realms = [
            { name: '筑基', badge: '· 初入道门 ·' },
            { name: '旋照', badge: '· 气机初动 ·' },
            { name: '融合', badge: '· 神意相合 ·' },
            { name: '心动', badge: '· 丹火始燃 ·' },
            { name: '灵寂', badge: '· 虚室生白 ·' },
            { name: '元婴', badge: '· 丹成九转 ·' }
        ];

        function updateDisplay() {
            const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
            const secs = String(Math.floor(seconds % 60)).padStart(2, '0');
            timerDisplay.textContent = mins + ':' + secs;

            const progress = Math.min(100, (seconds / TARGET_SECONDS) * 100);
            progressPercent.textContent = Math.floor(progress) + '%';
            stoneWear.style.width = progress + '%';

            const offset = TOTAL_LENGTH * (1 - progress / 100);
            stickBurn.setAttribute('stroke-dashoffset', offset);

            qiDisplay.textContent = Math.floor(qi);
            countDisplay.textContent = count;
            realmDisplay.textContent = realms[realmIndex].name;
            realmBadge.textContent = realms[realmIndex].badge;

            if (seconds >= TARGET_SECONDS && !isComplete) {
                completePractice();
            }
        }

        // ============================================
        // 圆满
        // ============================================
        function completePractice() {
            if (isComplete) return;
            isComplete = true;
            isRunning = false;
            if (timer) { clearInterval(timer);
                timer = null; }

            stopWaterSound();
            playChime();

            timerDisplay.classList.add('complete');
            realmBadge.classList.add('complete');
            stickBurn.setAttribute('stroke-dashoffset', '0');
            progressPercent.textContent = '100%';
            stoneWear.style.width = '100%';
            tipGlow.classList.remove('burning');

            labelText.textContent = '圆 满';
            mainBtn.classList.add('complete');
            lever.classList.remove('active');
            mainBtn.classList.remove('active');

            addPracticeDay();
        }

        // ============================================
        // 境界突破
        // ============================================
        function checkRealm() {
            const nextIndex = realmIndex + 1;
            if (nextIndex >= realms.length) return;
            const needed = nextIndex * 30;
            if (seconds >= needed && qi >= needed * 2) {
                realmIndex = nextIndex;
                realmBadge.classList.add('active');
                qi += 20;
                if (qi > 999) qi = 999;
                timerDisplay.style.transition = 'all 0.2s';
                timerDisplay.style.color = 'rgba(255,255,255,1)';
                setTimeout(() => { timerDisplay.style.color = ''; }, 400);
            }
        }

        // ============================================
        // 小石头拨杆逻辑
        // ============================================
        function handleMainClick() {
            const checkbox = mainBtn.querySelector('input');
            const isChecked = checkbox.checked;

            if (isComplete) {
                checkbox.checked = false;
                return;
            }

            if (isChecked) {
                if (!isRunning) startPractice();
                mainBtn.classList.add('active');
                labelText.textContent = '收 功';
            } else {
                if (isRunning) stopPractice();
                mainBtn.classList.remove('active');
                labelText.textContent = '开 炼';
            }
        }

        // ============================================
        // 石头归零
        // ============================================
        function handleStoneReset() {
            resetAll();
            stoneBtn.classList.add('reset-glow');
            setTimeout(() => {
                stoneBtn.classList.remove('reset-glow');
            }, 600);
        }

        // ============================================
        // 开始 / 暂停 / 重置
        // ============================================
        function startPractice() {
            if (isRunning || isComplete) return;

            playBell();
            startWaterSound();

            isRunning = true;
            timer = setInterval(() => {
                seconds += 1;
                qi += 1.5;
                count += 1;
                if (qi > 999) qi = 999;
                triggerDrop();
                checkRealm();
                updateDisplay();
            }, 1000);

            timerDisplay.classList.add('running');
            tipGlow.classList.add('burning');
        }

        function stopPractice() {
            if (!isRunning) return;
            isRunning = false;
            clearInterval(timer);
            timer = null;

            stopWaterSound();
            timerDisplay.classList.remove('running');
            tipGlow.classList.remove('burning');
        }

        function resetAll() {
            if (isRunning) {
                isRunning = false;
                clearInterval(timer);
                timer = null;
            }
            if (timer) { clearInterval(timer);
                timer = null; }
            stopWaterSound();

            seconds = 0;
            qi = 0;
            count = 0;
            realmIndex = 0;
            isComplete = false;
            isRunning = false;

            timerDisplay.classList.remove('complete', 'running');
            realmBadge.classList.remove('active', 'complete');
            stickBurn.setAttribute('stroke-dashoffset', TOTAL_LENGTH);
            progressPercent.textContent = '0%';
            stoneWear.style.width = '0%';
            waterDrop.classList.remove('falling');
            tipGlow.classList.remove('burning');
            splashContainer.innerHTML = '';

            const checkbox = mainBtn.querySelector('input');
            checkbox.checked = false;
            mainBtn.classList.remove('active', 'complete');
            labelText.textContent = '开 炼';
            labelText.classList.remove('active', 'complete');

            // 重置安装横幅状态
            bannerShown = false;
            hideInstallBanner();
            // 重新显示横幅
            setTimeout(() => showInstallBanner(), 1500);

            updateDisplay();
        }

        // ============================================
        // 事件绑定
        // ============================================
        mainBtn.addEventListener('click', handleMainClick);
        stoneBtn.addEventListener('click', handleStoneReset);

        floatToggle.addEventListener('click', toggleFloat);
        floatExpand.addEventListener('click', function() {
            if (isFloating) toggleFloat();
        });
        floatReset.addEventListener('click', resetAll);

        // 安装指引
        installBtn.addEventListener('click', showInstallGuide);
        installClose.addEventListener('click', hideInstallGuide);
        copyBtn.addEventListener('click', copyLink);
        installGuide.addEventListener('click', function(e) {
            if (e.target === this) hideInstallGuide();
        });

        // 安装横幅
        bannerInstallBtn.addEventListener('click', showInstallGuide);
        bannerCloseBtn.addEventListener('click', hideInstallBanner);

        // 容器拖动
        container.addEventListener('mousedown', initDrag);
        container.addEventListener('mousemove', moveDrag);
        container.addEventListener('mouseup', endDrag);
        container.addEventListener('mouseleave', endDrag);
        container.addEventListener('touchstart', initDrag, { passive: true });
        container.addEventListener('touchmove', moveDrag, { passive: false });
        container.addEventListener('touchend', endDrag, { passive: true });

        // ============================================
        // 初始化
        // ============================================
        updateDate();
        loadDays();

        setTimeout(() => {
            waterDrop.classList.add('falling');
            setTimeout(() => { waterDrop.classList.remove('falling'); }, 1300);
        }, 500);

        updateDisplay();

        // 检查是否已安装，未安装则显示横幅
        setTimeout(() => showInstallBanner(), 1000);

        console.log('✅ 丹道少年 · 小石头拨杆 · 完整版已加载');
        console.log('📱 已安装状态:', isInstalled() ? '✅ 是（全屏模式）' : '❌ 否');
        console.log('📌 点击「安装」或底部横幅获取安装指引');
        console.log('🪟 点击「浮窗」切换浮窗模式');
    </script>
</body>
</html>
